<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Check</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

    <div class="card">
        <form id="checkForm">
            <div class="input-group">
                <label for="textInput">Which country is Marius from?</label>
                <input type="text" id="textInput" placeholder="type just the country name" required>
            </div>
            <button type="submit">Submit</button>
        </form>

        <!-- Result Section -->
        <div id="resultContent" class="hidden-section">
            <p id="resultMessage"></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('checkForm');
        const resultContent = document.getElementById('resultContent');
        const resultMessage = document.getElementById('resultMessage');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const userInput = document.getElementById('textInput').value.trim().toLowerCase();

            // Compare the user's hashed input against the target hash
            if (userInput == "lithuania") {
                resultMessage.textContent = "Marius admires Aleksandra";
                resultContent.style.backgroundColor = "#e6f4ea";
                resultContent.style.borderColor = "#34a853";
                resultContent.style.color = "#137333";
            } else {
                resultMessage.textContent = "Try agan";
                resultContent.style.backgroundColor = "#fce8e6";
                resultContent.style.borderColor = "#ea4335";
                resultContent.style.color = "#c5221f";
            }

            resultContent.style.display = 'block';
        });
    </script>

</body>
</html>
