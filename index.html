    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Page</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

    <main class="page_wrapper">
    <div class="question_window">
        <div class="question_box">
            <p> Find the smallest positive 2-digit number x satisfying:<br>
                x<sup>2</sup> + 5x + 6 == 0 (mod 13)
            </p>
        </div>

        <form id="form1">
            <input type="number" id="input1" placeholder="type smallest x here" required>
            <button type="submit">Submit</button>
        </form>
        <p id="message1" style="margin-top: 10px;"></p>
    </div>

    <div class="question_window">
        <div class="question_box">
            <p> Find the largest positive 2-digit number x satisfying:<br>
                x<sup>2</sup> + 5x + 6 == 0 (mod 13)
            </p>
        </div>

        <form id="form2">
		<input type="number" id="input2" placeholder="correct x => nice image" required>
            <button type="submit">Submit</button>
        </form>
	<p id="message2" style="margin-top: 10px;"></p>
    </div>

    <div id="imageContainer" style="margin-top: 10px;">
        <img id="successImage" alt="Success Image" style="max-width: 100%; height: auto;">
    </div>
    </main>

    <script>
        // First form logic (Smallest x)
        const form1 = document.getElementById("form1");
        const input1 = document.getElementById("input1");
        const message1 = document.getElementById("message1");

        form1.addEventListener("submit", function(event) {
            event.preventDefault();
            if (input1.valueAsNumber === 10) {
                message1.textContent = "Marius wants to kiss hot Aleksandra";
            } else {
                message1.textContent = "Try again";
            }
        });

        // Second form logic (Largest x)
        const form2 = document.getElementById("form2");
        const input2 = document.getElementById("input2");
        const message2 = document.getElementById("message2");
        const successImage = document.getElementById("successImage");

        // Display encrypted image as noise right from the beginning
        const encryptedBytes = getEncryptedImageBytes();
        renderImage(encryptedBytes);

        // When user submits a number, recompute image using number as key and rerender
        form2.addEventListener("submit", async function(event) {
            event.preventDefault();
            const decryptedBytes = await decrypt(encryptedBytes, input2.valueAsNumber);
            renderImage(decryptedBytes);
        });


        // Helper functions and encrypted data
        function renderImage(bytes) {
            const width = 348;
            const height = 464;
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i++) {
                data[i] = bytes[i];
            }
            ctx.putImageData(imageData, 0, 0);
            successImage.src = canvas.toDataURL();
        }

        async function decrypt(encryptedBytes, key) {
            const salt = encryptedBytes.slice(0, 16);
            const counter = encryptedBytes.slice(16, 32);
            const ciphertext = encryptedBytes.slice(32);

            const keyMaterial = await crypto.subtle.importKey(
                "raw",
                new TextEncoder().encode(String(key)),
                "PBKDF2",
                false,
                ["deriveKey"]
            );
            const ctrKey = await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial,
                { name: "AES-CTR", length: 256 },
                false,
                ["decrypt"]
            );
            return new Uint8Array(
                await crypto.subtle.decrypt(
                    { name: "AES-CTR", counter: counter, length: 64 },
                    ctrKey,
                    ciphertext
                )
            );
        }
