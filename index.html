<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Page</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

    <div class="question_window">
        <form id="checkForm">
            <div class="question_and_answer_box">
                <label for="textInput">Which country is Marius from?</label>
                <input type="text" id="textInput"
			placeholder="type just the country name">
            </div>
            <button type="submit">Submit</button>
        </form>

        <div id="resultContent" class="hidden-section">
            <p id="resultMessage"></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('checkForm');
        const resultContent = document.getElementById('resultContent');
        const resultMessage = document.getElementById('resultMessage');

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const userInput = document.getElementById('textInput').value;
            if (userInput.trim().toLowerCase() == "lithuania") {
                resultMessage.textContent = "Marius admires Aleksandra";
            } else {
                resultMessage.textContent = "Try again";
            }
            resultContent.style.display = 'block';
        });
    </script>

</body>
</html>
